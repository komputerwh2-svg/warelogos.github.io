<body>
    <div id="print-area"></div>
    <script>
        const data = JSON.parse(localStorage.getItem('printData'));
        if (data) {
            document.getElementById('print-area').innerHTML = data.html;
            setTimeout(() => {
                window.print();
                window.onafterprint = () => window.close();
            }, 800);
        }
    </script>
</body>
