<!-- ================= SUB-PAGE: CEKLIST MUAT ================= -->
<div id="subpage-ceklist-muat" class="fixed inset-0 bg-[#f4f4f4] z-[60] translate-x-full transition-transform duration-300 ease-in-out flex flex-col font-sans select-none overflow-hidden">
    
    <!-- Header -->
    <div class="w-full h-auto min-h-[50px] flex items-center justify-between px-3 shadow-md relative z-20" 
        style="background: linear-gradient(to bottom, #3c3c3c, #2a2a2a); border-bottom: 1px solid #1a1a1a;">
        <div class="flex items-center gap-4">
            <button onclick="tutupSubPageCeklistMuat()" class="miui-btn-back flex items-center justify-center gap-1 px-2.5 py-1 rounded text-xs font-bold text-orange-400 shadow-inner">
                <i class="fa-solid fa-chevron-left text-xs"></i>
                <span>Kembali</span>
            </button>
            <div class="h-6 w-[1px] bg-white/10 mx-1"></div>
            <h1 class="text-white font-bold text-[13px] ml-2 tracking-wide drop-shadow-md">
                Ceklist Muat
                <span id="display-waktu-ceklist" class="text-orange-500 font-bold text-[13px] ml-2 tracking-wide"></span>
            </h1>
        </div>

        <!-- Tombol Arsip Ceklist di Pojok Kanan Header -->
        <div class="relative">
            <button onclick="togglePopoverArsipCeklist(event)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[11px] font-black uppercase text-white shadow-md transition-all active:scale-95"
                style="background: linear-gradient(to bottom, #ff8b00, #f36c00);">
                <i class="fa-solid fa-box-archive text-xs"></i>
                <span>Arsip Ceklist</span>
            </button>

            <!-- Popover Daftar Arsip Ceklist Berdasarkan Tanggal (Diperlebar) -->
            <div id="popover-arsip-ceklist" class="hidden absolute right-0 mt-2 w-[380px] bg-white rounded-xl shadow-2xl border border-orange-300 p-3 z-50 text-slate-700 font-sans">
                <div class="flex items-center justify-between pb-2 mb-2 border-b border-orange-200">
                    <span class="text-[11px] font-black uppercase text-orange-700">Riwayat Arsip Cetak</span>
                </div>
                <div id="container-list-arsip-ceklist" class="max-h-72 overflow-y-auto miui-custom-scroll space-y-2 text-xs">
                    <div class="text-slate-400 italic text-[10px] text-center py-4">Belum ada riwayat arsip tersimpan...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Konten Utama: 2 Panel (Kiri 60% & Kanan 40%) -->
    <div class="flex-1 flex overflow-hidden p-3 gap-3">
        
        <!-- PANEL KIRI (60%): Kompak & Padat Informasi -->
        <div class="w-[60%] bg-white rounded-xl shadow-sm border border-orange-500 p-3 flex flex-col justify-between overflow-y-auto miui-custom-scroll space-y-3">
            <div class="space-y-2.5">
                
                <!-- Baris Tombol Import -->
                <div class="border border-orange-300 rounded-lg p-2 bg-slate-50 space-y-1.5">
                    <label class="text-[9px] font-black text-slate-500 uppercase tracking-wider block">Pilih Data Ceklist Muat:</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="importDO()" class="bg-orange-600 hover:bg-orange-700 text-white py-1.5 px-2.5 rounded-lg font-black text-[10px] uppercase transition shadow">
                            <i class="fa-solid fa-file-import mr-1"></i> Import DO
                        </button>
                        <button onclick="importFDN()" class="bg-amber-600 hover:bg-amber-700 text-white py-1.5 px-2.5 rounded-lg font-black text-[10px] uppercase transition shadow">
                            <i class="fa-solid fa-cloud-arrow-down mr-1"></i> Import FDN
                        </button>
                    </div>
                </div>

                <!-- Panel Daftar Nomor FDN / Tujuan -->
                <div class="border border-orange-300 rounded-lg p-2 bg-slate-50 space-y-1">
                    <label class="text-[9px] font-black text-slate-500 uppercase tracking-wider block">Daftar Nomor FDN / DO</label>
                    <div id="container-list-fdn-ceklist" class="w-full h-[130px] max-h-[130px] bg-white border border-orange-300 rounded p-1.5 overflow-y-auto miui-custom-scroll text-[10px] font-mono text-slate-700 shadow-inner">
                        <div class="text-slate-400 text-xs">Belum ada data DO atau FDN diimport...</div>
                    </div>
                </div>

                <!-- Panel Paste Data Bosnet & Tombol Aksi -->
                <div class="border border-orange-300 rounded-lg p-2 bg-slate-50 space-y-1.5">
                    <label class="text-[9px] font-black text-slate-500 uppercase tracking-wider block">Pastekan Data Bosnet WHNB-2:</label>
                    
                    <!-- Textarea khusus untuk Header / Metadata DO -->
                    <div>
                        <textarea id="ta-bosnet-meta" 
                            class="w-full h-[30px] p-1.5 bg-white border border-orange-300 rounded text-[10px] font-medium text-slate-700 focus:border-orange-500 transition-all resize-none shadow-inner"
                            placeholder="Paste Konfirmasi DO di sini (Cth: DO-HO001-... - Nama Customer - Tanggal)..."></textarea>
                    </div>

                    <div class="flex gap-2">
                        <!-- Textarea untuk Item Detail Barang -->
                        <textarea id="ta-bosnet-input" 
                            class="w-full h-[70px] p-2 bg-white border border-orange-300 rounded text-[10px] font-medium text-slate-700 focus:border-orange-500 transition-all resize-none shadow-inner"
                            placeholder="Paste baris detail item WHNB-2 di sini..."></textarea>
                        
                        <div class="flex flex-col gap-1.5 flex-shrink-0 w-24">
                            <button onclick="prosesDataWHNB2()" class="h-[34px] bg-orange-600 hover:bg-orange-700 text-white rounded font-black text-[9px] uppercase tracking-wider flex items-center justify-center gap-1 shadow transition">
                                <i class="fa-solid fa-paste"></i> WHNB-2
                            </button>
                            <button onclick="cetakCeklistMuat()" class="h-[34px] bg-slate-800 hover:bg-slate-900 text-white rounded font-black text-[9px] uppercase tracking-wider flex items-center justify-center gap-1 shadow transition">
                                <i class="fa-solid fa-print"></i> Cetak
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Panel Grup TITIPAN -->
                <div class="border border-orange-300 rounded-lg p-2 bg-orange-50/40 space-y-2 relative">
                    <h4 class="text-[9px] font-black text-slate-500 uppercase tracking-wider">Tambahkan Titipan:</h4>
                    
                    <div class="grid grid-cols-3 gap-1.5">
                        <button onclick="bukaPopoverTitipan('PROMOSI', event)" class="bg-orange-600 hover:bg-orange-700 text-white py-1.5 px-2.5 rounded-lg font-black text-[10px] uppercase transition shadow">
                            PROMOSI
                        </button>
                        <button onclick="bukaPopoverTitipan('HRD', event)" class="bg-orange-600 hover:bg-orange-700 text-white py-1.5 px-2.5 rounded-lg font-black text-[10px] uppercase transition shadow">
                            HRD
                        </button>
                        <button onclick="bukaPopoverTitipan('TINGGALAN', event)" class="bg-orange-600 hover:bg-orange-700 text-white py-1.5 px-2.5 rounded-lg font-black text-[10px] uppercase transition shadow">
                            TINGGALAN
                        </button>
                    </div>

                    <!-- Kotak Preview List Titipan diperbesar tingginya -->
                    <div id="container-list-titipan" class="w-full h-[175px] max-h-[175px] bg-white border border-orange-300 rounded p-1.5 overflow-y-auto miui-custom-scroll text-[10px] font-mono text-slate-700 shadow-inner space-y-1">
                        <div class="text-slate-400 text-xs">Belum ada item titipan ditambahkan...</div>
                    </div>
                </div>

                <!-- Popover Input Titipan (Tersembunyi secara *default*) -->
                <div id="popover-form-titipan" class="hidden absolute bg-white rounded-xl shadow-2xl border border-orange-300 p-3 z-50 w-64 text-slate-700 font-sans">
                    <div class="flex items-center justify-between pb-2 mb-2 border-b border-orange-200">
                        <span id="judul-popover-titipan" class="text-[11px] font-black uppercase text-orange-700">Tambah Titipan</span>
                        <button onclick="tutupPopoverTitipan()" class="text-slate-400 hover:text-slate-600 text-xs font-bold"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="space-y-2 text-xs">
                        <div>
                            <label class="text-[9px] font-bold text-slate-500 uppercase block mb-0.5">Nama Barang / Keterangan</label>
                            <input type="text" id="input-nama-titipan" class="w-full p-1.5 border border-orange-300 rounded text-xs uppercase focus:border-orange-500 outline-none" placeholder="Ketik nama barang...">
                        </div>
                        <div>
                            <label class="text-[9px] font-bold text-slate-500 uppercase block mb-0.5">Qty</label>
                            <input type="number" id="input-qty-titipan" class="w-full p-1.5 border border-orange-300 rounded text-xs font-medium focus:border-orange-500 outline-none" value="1" min="1" placeholder="KETIK JUMLAH QTY...">
                        </div>
                        <button onclick="simpanDataTitipan()" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-1.5 rounded font-black text-[10px] uppercase tracking-wider shadow transition mt-1">
                            Simpan Item Titipan
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <!-- PANEL KANAN (40%): Tabel Item Barang -->
        <div class="w-[40%] bg-white rounded-xl shadow-sm border border-orange-500 p-3 flex flex-col overflow-hidden">
            <!-- Ubah bagian header tabel kanan di file HTML menjadi seperti ini: -->
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-[10px] font-black text-slate-700 uppercase tracking-wider">Item Barang Muat</h3>
                <span id="info-total-muat-keseluruhan" class="text-[10px] font-black text-orange-600 bg-orange-100 px-2 py-0.5 rounded shadow-inner">
                    TOTAL MUAT KESELURUHAN: 0 KRT [0 Item]
                </span>
            </div>
            
            <div class="flex-1 overflow-x-auto overflow-y-auto miui-custom-scroll border border-orange-200 rounded-lg">
                <table class="w-full text-left border-collapse text-[10px]">
                    <thead>
                        <tr class="bg-orange-100 text-slate-700 uppercase font-black sticky top-0 z-10">
                            <th class="p-1.5 border bg-orange-100">KODE BARANG</th>
                            <th class="p-1.5 border text-center bg-orange-100">QTY</th>
                            <th class="p-1.5 border text-center bg-orange-100">GUDANG</th>
                            <th class="p-1.5 border bg-orange-100">NO. DO/FDN</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-item-ceklist-body">
                        <tr>
                            <td colspan="4" class="p-3 text-center text-slate-400 text-xs">Belum ada data barang</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
