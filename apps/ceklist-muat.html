<!-- ================= SUB-PAGE: CEKLIST MUAT ================= -->
<div id="subpage-ceklist-muat" class="fixed inset-0 bg-[#f4f4f4] z-[60] translate-x-full transition-transform duration-300 ease-in-out flex flex-col font-sans select-none overflow-hidden">
    
    <!-- Header -->
    <div class="w-full h-auto min-h-[60px] flex items-center justify-between px-3 shadow-md relative z-10" 
        style="background: linear-gradient(to bottom, #3c3c3c, #2a2a2a); border-bottom: 1px solid #1a1a1a;">
        <div class="flex items-center gap-4">
            <button onclick="tutupSubPageCeklistMuat()" class="miui-btn-back flex items-center justify-center gap-1 px-3 py-1.5 rounded text-xs font-bold text-orange-400 shadow-inner">
                <i class="fa-solid fa-chevron-left text-sm"></i>
                <span>Kembali</span>
            </button>
            <div class="h-8 w-[1px] bg-white/10 mx-1"></div>
            <h1 class="text-white font-bold text-[14px] ml-3 tracking-wide drop-shadow-md">
                Ceklist Muat
                <span id="display-waktu-ceklist" class="text-orange-500 font-bold text-[14px] ml-3 tracking-wide"></span>
            </h1>
        </div>
    </div>

    <!-- Konten Utama: 2 Panel (Kiri 60% & Kanan 40%) -->
    <div class="flex-1 flex overflow-hidden p-4 gap-4">
        
        <!-- PANEL KIRI (60%): Input, Tombol Import, FDN List, Paste Bosnet, & Titipan -->
        <div class="w-[60%] bg-white rounded-2xl shadow-sm border border-orange-500 p-4 flex flex-col justify-between overflow-y-auto miui-custom-scroll space-y-4">
            <div class="space-y-4">
                
                <!-- Panel Grup Pilih Data Ceklist Muat (Import DO & FDN) -->
                <div class="border border-orange-300 rounded-xl p-3 bg-slate-50 space-y-2">
                    <label class="text-[11px] font-black text-slate-500 uppercase tracking-widest ml-1 block">Pilih Data Ceklist Muat:</label>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="importDO()" class="bg-orange-600 hover:bg-orange-700 text-white py-2.5 px-3 rounded-xl font-black text-[11px] uppercase transition shadow">
                            <i class="fa-solid fa-file-import mr-1.5"></i> Import DO
                        </button>
                        <button onclick="importFDN()" class="bg-amber-600 hover:bg-amber-700 text-white py-2.5 px-3 rounded-xl font-black text-[11px] uppercase transition shadow">
                            <i class="fa-solid fa-cloud-arrow-down mr-1.5"></i> Import FDN
                        </button>
                    </div>
                </div>

                <!-- Panel Daftar Nomor FDN / Tujuan -->
                <div class="border border-orange-300 rounded-xl p-3 bg-slate-50 space-y-1">
                    <label class="text-[11px] font-black text-slate-500 uppercase tracking-widest ml-1 block">Daftar Nomor FDN / Tujuan (Klik salah satu daftar untuk melihat detil surat)</label>
                    <div id="container-list-fdn-ceklist" class="w-full h-[110px] max-h-[110px] bg-white border border-orange-300 rounded-xl p-2.5 overflow-y-auto miui-custom-scroll text-[10px] font-mono text-slate-700 shadow-inner">
                        <div class="text-slate-400 text-xs">Belum ada data DO atau FDN diimport...</div>
                    </div>
                </div>

                <!-- Panel Paste Data Bosnet & Tombol WHNB-2 / Cetak -->
                <div class="border border-orange-300 rounded-xl p-3 bg-slate-50 space-y-2">
                    <div class="flex items-center justify-between">
                        <label class="text-[11px] font-black text-slate-500 uppercase tracking-widest ml-1 block">Pastekan data bosnet kesini:</label>
                    </div>
                    <div class="flex gap-2">
                        <textarea id="ta-bosnet-input" 
                            class="w-full h-[112px] p-3 bg-slate-50 border border-orange-500 rounded-xl text-xs font-medium text-slate-700 focus:border-orange-500 transition-all resize-none shadow-inner"
                            placeholder="Paste data WHNB-2 dari Bosnet di sini..."></textarea>
                        
                        <!-- Kolom Tombol Terbagi 2 (WHNB-2 di atas, Cetak di bawah) -->
                        <div class="flex flex-col gap-2 flex-shrink-0 w-28">
                            <button onclick="prosesPasteWhnb2()" class="h-[52px] bg-orange-600 hover:bg-orange-700 text-white rounded-xl font-black text-[11px] uppercase tracking-wider flex flex-col items-center justify-center p-1 shadow transition">
                                <i class="fa-solid fa-paste text-sm mb-1"></i>
                                WHNB-2
                            </button>
                            <button onclick="cetakCeklistMuat()" class="h-[52px] bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-black text-[10px] uppercase tracking-wider flex flex-col items-center justify-center p-1 shadow transition">
                                <i class="fa-solid fa-print text-sm mb-1"></i>
                                CETAK
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Panel Grup TITIPAN (Promosi, HRD, Tinggalan) -->
                <div class="border border-orange-300 rounded-xl p-3 bg-orange-50/40 space-y-3 relative">
                    <h4 class="text-[11px] font-black text-orange-700 uppercase tracking-wider">Titipan</h4>
                    
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="bukaPopoverTitipan('PROMOSI', event)" class="bg-white border border-orange-300 hover:bg-orange-100 text-orange-800 font-bold py-2 rounded-lg text-xs shadow-sm transition">
                            PROMOSI
                        </button>
                        <button onclick="bukaPopoverTitipan('HRD', event)" class="bg-white border border-orange-300 hover:bg-orange-100 text-orange-800 font-bold py-2 rounded-lg text-xs shadow-sm transition">
                            HRD
                        </button>
                        <button onclick="bukaPopoverTitipan('TINGGALAN', event)" class="bg-white border border-orange-300 hover:bg-orange-100 text-orange-800 font-bold py-2 rounded-lg text-xs shadow-sm transition">
                            TINGGALAN
                        </button>
                    </div>

                    <!-- Daftar Item Titipan -->
                    <div id="container-list-titipan" class="space-y-2 pt-2 border-t border-orange-200">
                        <span class="text-[11px] text-slate-400 italic">Belum ada item titipan ditambahkan</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- PANEL KANAN (40%): Tabel Item Barang -->
        <div class="w-[40%] bg-white rounded-2xl shadow-sm border border-orange-500 p-4 flex flex-col overflow-hidden">
            <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider mb-3">Item Barang Muat</h3>
            
            <div class="flex-1 overflow-x-auto overflow-y-auto miui-custom-scroll border border-orange-200 rounded-xl">
                <table class="w-full text-left border-collapse text-[11px]">
                    <thead>
                        <tr class="bg-orange-100 text-slate-700 uppercase font-black sticky top-0 z-10">
                            <th class="p-2 border bg-orange-100">KODE BARANG</th>
                            <th class="p-2 border text-center bg-orange-100">QTY</th>
                            <th class="p-2 border text-center bg-orange-100">GUDANG</th>
                            <th class="p-2 border bg-orange-100">NO. DO/FDN</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-item-ceklist-body">
                        <tr>
                            <td colspan="4" class="p-4 text-center text-slate-400 italic">Belum ada data barang</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
