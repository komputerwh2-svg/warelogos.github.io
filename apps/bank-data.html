<div id="subpage-bank-data" class="fixed inset-0 bg-[#f4f4f4] z-[60] translate-x-full transition-transform duration-300 ease-in-out flex flex-col font-sans select-none overflow-hidden">
    
    <div class="w-full bg-[#1c1c1c] text-gray-400 text-[11px] px-4 py-1 flex justify-between items-center border-b border-black/30 shadow-sm">
        <div class="flex items-center gap-2 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">
            <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
            <span class="text-emerald-700 font-semibold text-[11px]">Admin</span>
        </div>
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up text-[10px] text-green-500"></i>
            <span class="text-gray-300 font-medium text-[10px]">Live Firebase Sync</span>
        </div>
    </div>

    <div class="w-full h-14 flex items-center justify-between px-3 shadow-md relative z-10" 
         style="background: linear-gradient(to bottom, #3c3c3c, #2a2a2a); border-b: 1px solid #1a1a1a;">
        
        <div class="flex items-center">
            <button onclick="tutupSubPageBankData()" class="miui-btn-back flex items-center justify-center gap-1 px-3 py-1.5 rounded text-xs font-bold text-orange-400 shadow-inner">
                <i class="fa-solid fa-chevron-left text-sm"></i>
                <span>Kembali</span>
            </button>
            <h1 class="text-white font-semibold text-sm ml-3 tracking-wide drop-shadow-md">Setelan Bank Data</h1>
        </div>

        <div class="flex items-center bg-black/35 p-1 rounded-xl border border-black/30 shadow-inner">
            <label class="relative flex items-center justify-center px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider cursor-pointer transition-all select-none group">
                <input type="radio" name="rb-mode-bank-data" value="KODE" checked onchange="gantiSwitchModeBankData(this.value)" class="sr-only peer">
                <span class="z-10 text-gray-400 peer-checked:text-white transition-colors">KODE</span>
                <div class="absolute inset-0 rounded-lg shadow-sm opacity-0 scale-95 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-200" style="background: linear-gradient(to bottom, #ff8b00, #f36c00); border: 1px solid #d95d00;"></div>
                <span class="absolute z-20 opacity-0 peer-checked:opacity-100 font-black text-white text-xs uppercase tracking-wider">KODE</span>
            </label>

            <label class="relative flex items-center justify-center px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider cursor-pointer transition-all select-none group">
                <input type="radio" name="rb-mode-bank-data" value="DRIVER" onchange="gantiSwitchModeBankData(this.value)" class="sr-only peer">
                <span class="z-10 text-gray-400 peer-checked:text-white transition-colors">DRIVER</span>
                <div class="absolute inset-0 rounded-lg shadow-sm opacity-0 scale-95 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-200" style="background: linear-gradient(to bottom, #ff8b00, #f36c00); border: 1px solid #d95d00;"></div>
                <span class="absolute z-20 opacity-0 peer-checked:opacity-100 font-black text-white text-xs uppercase tracking-wider">DRIVER</span>
            </label>

            <label class="relative flex items-center justify-center px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider cursor-pointer transition-all select-none group">
                <input type="radio" name="rb-mode-bank-data" value="TUJUAN" onchange="gantiSwitchModeBankData(this.value)" class="sr-only peer">
                <span class="z-10 text-gray-400 peer-checked:text-white transition-colors">TUJUAN</span>
                <div class="absolute inset-0 rounded-lg shadow-sm opacity-0 scale-95 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-200" style="background: linear-gradient(to bottom, #ff8b00, #f36c00); border: 1px solid #d95d00;"></div>
                <span class="absolute z-20 opacity-0 peer-checked:opacity-100 font-black text-white text-xs uppercase tracking-wider">TUJUAN</span>
            </label>
        </div>
    </div>

    <div class="flex-1 overflow-x-hidden overflow-y-auto bg-[#f4f4f4]">
        <div id="slider-content-bd" class="flex w-[300%] transition-transform duration-500 ease-in-out" style="transform: translateX(0%);">
            
            <div class="w-1/3 p-3.5 space-y-4">
                <div class="w-full bg-white rounded-xl border border-gray-300 shadow-sm overflow-hidden">
                    <div class="px-4 py-2.5 bg-gray-50 border-b border-gray-200 text-xs font-bold text-slate-700 uppercase">Tambah Data Kode</div>
                    <div class="p-4 space-y-3.5">
                        <input type="text" id="tx-kode-barang-bd" placeholder="Kode Barang" class="w-full px-3 py-2 text-xs font-bold uppercase border rounded-lg bg-gray-50/50">
                        <button onclick="simpanDataMasterBD('KODE')" class="w-full py-2.5 text-white font-black text-xs rounded-xl bg-orange-600">SIMPAN KODE</button>
                    </div>
                </div>
                <div class="w-full bg-white rounded-xl border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-[10px] uppercase text-slate-500"><tr><th class="p-3">Kode</th><th>Nama</th></tr></thead>
                        <tbody id="tabel-body-kode" class="divide-y text-[12px]"></tbody>
                    </table>
                </div>
            </div>

            <div class="w-1/3 p-3.5 space-y-4">
                <div class="w-full bg-white rounded-xl border border-gray-300 shadow-sm overflow-hidden">
                    <div class="px-4 py-2.5 bg-gray-50 border-b border-gray-200 text-xs font-bold text-slate-700 uppercase">Tambah Data Driver</div>
                    <div class="p-4 space-y-3.5">
                        <input type="text" id="tx-driver-nama" placeholder="Nama Driver" class="w-full px-3 py-2 text-xs font-bold border rounded-lg bg-gray-50/50">
                        <button onclick="simpanDataMasterBD('DRIVER')" class="w-full py-2.5 text-white font-black text-xs rounded-xl bg-orange-600">SIMPAN DRIVER</button>
                    </div>
                </div>
            </div>

            <div class="w-1/3 p-3.5 space-y-4">
                <div class="w-full bg-white rounded-xl border border-gray-300 shadow-sm overflow-hidden">
                    <div class="px-4 py-2.5 bg-gray-50 border-b border-gray-200 text-xs font-bold text-slate-700 uppercase">Tambah Data Tujuan</div>
                    <div class="p-4 space-y-3.5">
                        <input type="text" id="tx-id-tujuan" placeholder="ID Tujuan" class="w-full px-3 py-2 text-xs font-bold border rounded-lg bg-gray-50/50">
                        <button onclick="simpanDataMasterBD('TUJUAN')" class="w-full py-2.5 text-white font-black text-xs rounded-xl bg-orange-600">SIMPAN TUJUAN</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
