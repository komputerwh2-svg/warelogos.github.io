<div id="subpage-bank-data" class="fixed inset-0 bg-[#f4f4f4] z-[60] translate-x-full transition-transform duration-300 ease-in-out flex flex-col font-sans select-none overflow-hidden">
    
    <div class="w-full h-14 bg-gradient-to-b from-[#3c3c3c] to-[#2a2a2a] flex items-center justify-between px-3 shadow-md border-b border-[#1a1a1a]">
        <div class="flex items-center">
            <button onclick="tutupSubPageBankData()" class="miui-btn-back flex items-center justify-center gap-1 px-3 py-1.5 rounded text-xs font-bold text-orange-400 shadow-inner bg-gradient-to-b from-[#4c4c4c] to-[#383838] border border-[#222]">
                <i class="fa-solid fa-chevron-left text-sm"></i>
                <span>Kembali</span>
            </button>
            <h1 class="text-white font-semibold text-sm ml-3 tracking-wide drop-shadow-md">Setelan Bank Data & Kamus Barang</h1>
        </div>
        
        <div class="flex items-center gap-1.5">
            <div class="text-[10px] font-mono text-slate-400 bg-[#222] px-2 py-1 border border-slate-800 rounded">
                STATUS DB: <span id="db-status-bd" class="text-emerald-400 font-bold">ONLINE</span>
            </div>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto p-3 space-y-3 pb-10">
        
        <div class="grid grid-cols-12 gap-3">
            
            <div id="box-workspace-input-bd" class="col-span-7 bg-emerald-50/60 rounded-xl border border-[#dcdcdc] shadow-sm overflow-hidden flex flex-col transition-colors duration-200">
                <div class="p-3 border-b border-[#eaeaea] bg-slate-50 flex justify-between items-center h-11">
                    <span id="title-mode-form-bd" class="text-[10px] font-bold text-emerald-700 uppercase tracking-wide flex items-center gap-1">
                        <i class="fa-solid fa-square-plus text-emerald-600"></i> Tambah Kode Barang Baru
                    </span>
                    <div>
                        <span id="badge-mode-bd" class="text-[9px] font-black text-emerald-600 bg-emerald-100/80 px-2 py-0.5 rounded uppercase tracking-wider">BARU</span>
                    </div>
                </div>

                <form id="form-master-barang-bd" class="p-3 space-y-2.5 flex-1" onsubmit="simpanMasterDataFirebase(event)">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[9px] font-bold text-slate-500 block mb-0.5">Kode Barang</label>
                            <input type="text" id="tx-kode-barang-bd" placeholder="Contoh: CRR4A01" required autocomplete="off"
                                   class="w-full bg-white border border-[#c8c8c8] rounded-md py-1 px-1.5 text-[11px] font-bold text-slate-800 focus:outline-none focus:border-orange-500 uppercase tracking-wide">
                        </div>
                        <div>
                            <label class="text-[9px] font-bold text-slate-500 block mb-0.5">QTY Utuhan / Palet</label>
                            <div class="relative">
                                <input type="number" id="tx-qty-utuhan-bd" placeholder="95" required min="1"
                                       class="w-full bg-white border border-[#c8c8c8] rounded-md py-1 px-1.5 text-[11px] font-bold text-slate-800 focus:outline-none focus:border-orange-500 font-mono">
                                <span class="absolute right-2 top-1.5 text-[8px] font-bold text-slate-400 uppercase">KRT</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="text-[9px] font-bold text-slate-500 block mb-0.5">Nama Barang / Deskripsi Item</label>
                        <input type="text" id="tx-nama-barang-bd" placeholder="Masukkan detail deskripsi rasa/kemasan barang..." required
                               class="w-full bg-white border border-[#c8c8c8] rounded-md py-1 px-1.5 text-[11px] font-bold text-slate-800 focus:outline-none focus:border-orange-500">
                    </div>

                    <div class="pt-1 flex gap-1.5">
                        <button type="button" onclick="resetFormMasterBD()" class="px-3 py-1.5 bg-white text-slate-600 font-bold text-[10px] rounded-lg border border-slate-300 shadow-sm active:bg-slate-100 transition-all">BATAL</button>
                        <button type="submit" id="btn-submit-master-bd" class="flex-1 py-1.5 bg-gradient-to-b from-[#10b981] to-[#059669] text-white font-bold text-[10px] rounded-lg shadow-md border border-emerald-600 tracking-wide text-center uppercase">
                            TAMBAH KODE
                        </button>
                    </div>
                </form>
            </div>

            <div class="col-span-5 flex flex-col justify-between gap-1.5">
                <div class="bg-gradient-to-r from-white to-emerald-50 border border-emerald-200 rounded-lg px-2 py-1.5 flex justify-between items-center shadow-sm">
                    <span class="text-[8px] font-bold text-emerald-700 uppercase tracking-tight">Total Item Terdaftar</span>
                    <span id="info-total-item-bd" class="text-xs font-black text-slate-800 tracking-wide font-mono">0 <span class="text-[8px] font-normal text-slate-400">ITEM</span></span>
                </div>
                
                <div class="bg-white border border-[#dcdcdc] rounded-lg p-2 flex flex-col justify-center flex-1 shadow-sm">
                    <label class="text-[8px] font-bold text-slate-500 uppercase tracking-tight mb-1 block"><i class="fa-solid fa-magnifying-glass"></i> Pencarian Cepat</label>
                    <input type="text" id="tx-cari-barang-bd" placeholder="Ketik kode / nama barang..." oninput="liveSearchBankData(this.value)"
                           class="w-full bg-slate-50 border border-[#c8c8c8] rounded-md py-1 px-1.5 text-[11px] font-bold text-slate-800 focus:outline-none focus:border-orange-500">
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-[#dcdcdc] shadow-sm overflow-hidden">
            <div class="bg-gradient-to-b from-slate-50 to-slate-100 px-3 py-2 border-b border-[#e5e5e5] flex justify-between items-center">
                <span class="text-[10px] font-bold text-slate-700 uppercase tracking-wider">DATABASE UTAMA: <span class="text-orange-600 font-black">SHEET KODE / REKAP BLOK ACUAN</span></span>
                <span class="text-[8px] bg-orange-50 px-2 py-0.5 rounded border border-orange-200 text-orange-600 font-bold">LIVE FIREBASE</span>
            </div>
            
            <div class="overflow-x-auto max-h-[280px]">
                <table class="w-full text-left text-[11px] border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-[9px] font-bold uppercase tracking-wider sticky top-0 z-10">
                            <th class="py-1.5 px-3 text-center w-12">NO</th>
                            <th class="py-1.5 px-4">KODE ITEM BARANG</th>
                            <th class="py-1.5 px-4">NAMA / DESKRIPSI BARANG</th>
                            <th class="py-1.5 px-4 text-center w-28">QTY UTUHAN (KRT)</th>
                            <th class="py-1.5 px-3 text-center w-20">AKSI</th>
                        </tr>
                    </thead>
                    <tbody id="table-master-body-bd" class="divide-y divide-slate-100 font-medium text-slate-800">
                        <tr>
                            <td colspan="5" class="text-center py-10 text-slate-400 font-bold">
                                <i class="fa-solid fa-spinner fa-spin mr-1"></i> Sinkronisasi Database Firebase...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
