<div id="subpage-bank-data" class="fixed inset-0 bg-[#f4f4f4] z-[60] translate-x-full transition-transform duration-300 ease-in-out flex flex-col font-sans select-none overflow-hidden">
    
    <div class="w-full bg-[#1c1c1c] text-gray-400 text-[11px] px-4 py-1 flex justify-between items-center border-b border-black/30 shadow-sm">
        <span class="text-orange-500 font-bold tracking-wide">MIUI v5 Framework</span>
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up text-[10px] text-emerald-500"></i>
            <span class="text-gray-300 font-medium text-[10px]">Live Firebase Sync</span>
        </div>
    </div>

    <div class="w-full h-14 bg-gradient-to-b from-[#3273ec] to-[#1a51c5] flex items-center px-3 shadow-md border-b-2 border-[#103891] relative z-10">
        <button onclick="tutupSubPageBankData()" class="flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-md text-xs font-bold bg-black/15 hover:bg-black/25 text-white border border-white/10 active:scale-95 transition-all shadow-inner">
            <i class="fa-solid fa-chevron-left text-sm"></i>
            <span>Kembali</span>
        </button>
        <h1 class="text-white font-bold text-base ml-4 tracking-wide drop-shadow-[0_2px_2px_rgba(0,0,0,0.4)]">Setelan Bank Data</h1>
    </div>

    <div class="flex-1 overflow-y-auto p-3.5 space-y-4 bg-[#f4f4f4]">
        
        <div id="box-workspace-input-bd" class="w-full bg-white rounded-xl border border-gray-300 shadow-[0_2px_4px_rgba(0,0,0,0.06)] overflow-hidden transition-all duration-300">
            
            <div class="px-4 py-2 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                <span id="title-mode-form-bd" class="text-xs font-bold text-slate-700 uppercase tracking-wide flex items-center gap-1.5">
                    <i class="fa-solid fa-square-plus text-emerald-600 text-sm"></i> Tambah Kode Barang Baru
                </span>
                <span id="badge-mode-bd" class="text-[9px] font-black text-emerald-600 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded uppercase tracking-wider">BARU</span>
            </div>

            <form id="form-master-barang-bd" onsubmit="event.preventDefault();" class="p-4 space-y-3.5">
                <div class="grid grid-cols-2 gap-3">
                    <div class="flex flex-col gap-1">
                        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-tight">Kode Barang</label>
                        <input type="text" id="tx-kode-barang-bd" placeholder="Contoh: CRR4A01" class="w-full px-3 py-2 text-xs font-mono font-bold uppercase border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 bg-gray-50/50 transition-all">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-tight">Inisial Ringkas</label>
                        <input type="text" id="tx-inisial-barang-bd" placeholder="Contoh: CRR 01" class="w-full px-3 py-2 text-xs font-mono font-bold uppercase border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 bg-gray-50/50 transition-all">
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-[11px] font-bold text-slate-500 uppercase tracking-tight">Nama Barang Utuh</label>
                    <input type="text" id="tx-nama-barang-bd" placeholder="Masukkan nama item deskriptif..." class="w-full px-3 py-2 text-xs font-semibold uppercase border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 bg-gray-50/50 transition-all">
                </div>

                <div class="flex flex-col gap-1 w-1/2">
                    <label class="text-[11px] font-bold text-slate-500 uppercase tracking-tight">Qty Awal (Karton)</label>
                    <div class="relative flex items-center">
                        <input type="number" id="tx-qty-utuhan-bd" min="0" placeholder="0" class="w-full px-3 py-2 text-xs font-mono font-bold border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 bg-gray-50/50 transition-all">
                        <span class="absolute right-3 text-[10px] font-bold text-slate-400">KRT</span>
                    </div>
                </div>

                <div class="pt-2 flex items-center gap-2.5">
                    <button type="button" id="btn-submit-master-bd" onclick="simpanDataMasterBD()" class="flex-1 py-2 rounded-lg text-xs font-bold text-white bg-gradient-to-b from-[#3b82f6] to-[#1d4ed8] border border-[#1e40af] shadow-sm hover:brightness-105 active:scale-[0.98] transition-all uppercase tracking-wide">
                        Tambah Kode
                    </button>
                    <button type="button" onclick="resetFormMasterBD()" class="px-4 py-2 rounded-lg text-xs font-bold text-slate-600 bg-gradient-to-b from-gray-50 to-gray-150 border border-gray-300 shadow-sm hover:bg-gray-100 active:scale-[0.98] transition-all uppercase tracking-wide">
                        Batal
                    </button>
                </div>
            </form>
        </div>

        <div class="w-full bg-white rounded-xl border border-gray-300 shadow-[0_2px_4px_rgba(0,0,0,0.06)] overflow-hidden">
            
            <div class="px-3.5 py-2.5 bg-gradient-to-r from-gray-50 to-slate-50 border-b border-gray-200 flex justify-between items-center">
                <span class="text-[10px] font-black text-slate-500 uppercase tracking-wider">Database Master Register</span>
                <span id="info-total-item-bd" class="text-xs font-mono font-black text-slate-800 bg-slate-200/60 px-2 py-0.5 rounded">
                    0 <span class="text-[9px] font-normal text-slate-500 ml-0.5">ITEM</span>
                </span>
            </div>

            <div class="overflow-x-auto max-h-[380px]">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100/90 border-b border-gray-300 text-slate-600 font-bold text-[11px] uppercase tracking-wider sticky top-0 z-20 shadow-sm backdrop-blur-sm">
                            <th class="py-3 px-2 w-10 text-center bg-gray-100">No</th>
                            <th class="py-3 px-3 text-left bg-gray-100 w-24">Inisial</th>
                            <th class="py-3 px-3 text-left bg-gray-100 w-28">Kode Barang</th>
                            <th class="py-3 px-3 text-left bg-gray-100">Nama Barang</th>
                            <th class="py-3 px-3 text-center bg-gray-100 w-20">Stok</th>
                            <th class="py-3 px-3 text-center bg-gray-100 w-20">Status</th>
                            <th class="py-3 px-2 w-12 text-center bg-gray-100">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-body-bank-data" class="divide-y divide-gray-200 text-[12px] font-medium text-slate-700">
                        <tr>
                            <td colspan="7" class="text-center py-14 text-slate-400 font-bold">
                                <i class="fa-solid fa-spinner fa-spin mr-1.5 text-blue-500"></i> Menghubungkan ke Live Firebase...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>
