<div id="subpage-bank-data" class="fixed inset-0 bg-[#f4f4f4] z-[60] translate-x-full transition-transform duration-300 ease-in-out flex flex-col font-sans select-none overflow-hidden">
    
    <div class="w-full bg-[#1c1c1c] text-gray-400 text-[11px] px-4 py-1 flex justify-between items-center border-b border-black/30 shadow-sm">
        <div class="flex items-center gap-2 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">
            <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
            <span class="text-emerald-700 font-semibold text-[11px]">Admin</span>
        </div>
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up text-[10px] text-green-500"></i>
            <span class="text-gray-300 font-medium text-[10px]">Live Firebase Sync</span>
        </div>
    </div>

    <div class="w-full h-14 flex items-center justify-between px-3 shadow-md relative z-10" 
         style="background: linear-gradient(to bottom, #3c3c3c, #2a2a2a); border-b: 1px solid #1a1a1a;">
        
        <div class="flex items-center">
            <button onclick="tutupSubPageBankData()" class="miui-btn-back flex items-center justify-center gap-1 px-3 py-1.5 rounded text-xs font-bold text-orange-400 shadow-inner">
                <i class="fa-solid fa-chevron-left text-sm"></i>
                <span>Kembali</span>
            </button>
            <h1 class="text-white font-semibold text-sm ml-3 tracking-wide drop-shadow-md">Setelan Bank Data</h1>
        </div>

        <div class="flex items-center bg-black/35 p-1 rounded-xl border border-black/30 shadow-inner">
            <label class="relative flex items-center justify-center px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider cursor-pointer transition-all select-none group">
                <input type="radio" name="rb-mode-bank-data" value="KODE" checked onchange="gantiSwitchModeBankData(this.value)" class="sr-only peer">
                <span class="z-10 text-gray-400 peer-checked:text-white transition-colors">KODE</span>
                <div class="absolute inset-0 rounded-lg shadow-sm opacity-0 scale-95 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-200" style="background: linear-gradient(to bottom, #ff8b00, #f36c00); border: 1px solid #d95d00;"></div>
                <span class="absolute z-20 opacity-0 peer-checked:opacity-100 font-black text-white text-xs uppercase tracking-wider">KODE</span>
            </label>

            <label class="relative flex items-center justify-center px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider cursor-pointer transition-all select-none group">
                <input type="radio" name="rb-mode-bank-data" value="DRIVER" onchange="gantiSwitchModeBankData(this.value)" class="sr-only peer">
                <span class="z-10 text-gray-400 peer-checked:text-white transition-colors">DRIVER</span>
                <div class="absolute inset-0 rounded-lg shadow-sm opacity-0 scale-95 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-200" style="background: linear-gradient(to bottom, #ff8b00, #f36c00); border: 1px solid #d95d00;"></div>
                <span class="absolute z-20 opacity-0 peer-checked:opacity-100 font-black text-white text-xs uppercase tracking-wider">DRIVER</span>
            </label>

            <label class="relative flex items-center justify-center px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-wider cursor-pointer transition-all select-none group">
                <input type="radio" name="rb-mode-bank-data" value="TUJUAN" onchange="gantiSwitchModeBankData(this.value)" class="sr-only peer">
                <span class="z-10 text-gray-400 peer-checked:text-white transition-colors">TUJUAN</span>
                <div class="absolute inset-0 rounded-lg shadow-sm opacity-0 scale-95 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-200" style="background: linear-gradient(to bottom, #ff8b00, #f36c00); border: 1px solid #d95d00;"></div>
                <span class="absolute z-20 opacity-0 peer-checked:opacity-100 font-black text-white text-xs uppercase tracking-wider">TUJUAN</span>
            </label>
        </div>
    </div>

    <div class="flex-1 overflow-x-hidden overflow-y-auto bg-[#f4f4f4]">
        <div id="slider-content-bd" class="flex w-[300%] transition-transform duration-500 ease-in-out" style="transform: translateX(0%);">           
                <div class="w-1/3 p-3.5 space-y-4">
                    <div class="px-4 py-2.5 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                    <span id="title-mode-form-bd" class="text-xs font-bold text-slate-700 uppercase tracking-wide flex items-center gap-1.5">
                        <i class="fa-solid fa-square-plus text-orange-500 text-sm"></i> Tambah Kode Barang Baru
                    </span>
                    <span id="badge-mode-bd" class="text-[9px] font-black text-orange-600 bg-orange-50 border border-orange-200 px-2 py-0.5 rounded uppercase tracking-wider">BARU</span>
                </div>

                <form id="form-master-general-bd" onsubmit="event.preventDefault();" class="p-4">
                    
                    <div id="slot-fields-mode-kode" class="space-y-3.5 block">
                        <div class="grid grid-cols-4 gap-3">
                            <div class="flex flex-col gap-1">
                                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-tight">Kode Barang</label>
                                <input type="text" id="tx-kode-barang-bd" placeholder="Contoh: MTR3A01" class="w-full px-3 py-2 text-xs font-mono font-bold uppercase border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 bg-gray-50/50 transition-all">
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-tight">Inisial Ringkas</label>
                                <input type="text" id="tx-inisial-barang-bd" placeholder="Contoh: MTR 01" class="w-full px-3 py-2 text-xs font-mono font-bold uppercase border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 bg-gray-50/50 transition-all">
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-tight">Kelompok</label>
                                <input type="text" id="tx-kelompok-barang-bd" placeholder="Contoh: MTR" class="w-full px-3 py-2 text-xs font-mono font-bold uppercase border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 bg-gray-50/50 transition-all">
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-tight">Target Cell</label>
                                <input type="text" id="tx-cell-barang-bd" placeholder="Contoh: G59" class="w-full px-3 py-2 text-xs font-mono font-bold uppercase border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 bg-gray-50/50 transition-all">
                            </div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-tight">Nama Barang Utuh</label>
                            <input type="text" id="tx-nama-barang-bd" placeholder="Masukkan nama item deskriptif..." class="w-full px-3 py-2 text-xs font-semibold uppercase border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 bg-gray-50/50 transition-all">
                        </div>
                        <div class="flex flex-col gap-1 w-1/4">
                            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-tight">Qty Utuhan (Karton)</label>
                            <div class="relative flex items-center">
                                <input type="number" id="tx-qty-utuhan-bd" min="0" placeholder="0" class="w-full px-3 py-2 text-xs font-mono font-bold border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 bg-gray-50/50 transition-all">
                                <span class="absolute right-3 text-[10px] font-bold text-slate-400">KRT</span>
                            </div>
                        </div>
                    </div>

                    <div id="slot-fields-mode-tujuan" class="space-y-3.5 hidden">
                        <div class="grid grid-cols-2 gap-3">
                            <div class="flex flex-col gap-1">
                                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-tight">ID / Kode Tujuan</label>
                                <input type="text" id="tx-id-tujuan-bd" placeholder="Contoh: TJN01" class="w-full px-3 py-2 text-xs font-mono font-bold uppercase border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 bg-gray-50/50 transition-all">
                            </div>
                            <div class="flex flex-col gap-1">
                                <label class="text-[11px] font-bold text-slate-500 uppercase tracking-tight">Nama Lokasi / Tujuan</label>
                                <input type="text" id="tx-nama-tujuan-bd" placeholder="Contoh: GUDANG UTAMA BARAT" class="w-full px-3 py-2 text-xs font-bold uppercase border border-gray-300 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-100 bg-gray-50/50 transition-all">
                            </div>
                        </div>
                    </div>

                    <div class="pt-4 flex items-center gap-2.5">
                        <button type="button" id="btn-submit-master-bd" onclick="simpanDataMasterBD()" 
                                class="flex-1 py-2.5 text-white font-black text-xs rounded-xl shadow-md active:scale-[0.98] transition-all uppercase tracking-widest"
                                style="background: linear-gradient(to bottom, #ff8b00, #f36c00); border: 1px solid #ea580c;">
                            TAMBAH KODE
                        </button>
                        <button type="button" onclick="resetFormMasterBD()" class="px-6 py-2.5 bg-[#666666] hover:bg-[#555555] text-white font-black text-xs rounded-xl shadow-md border border-[#444444] active:scale-[0.98] transition-all uppercase tracking-widest">
                            BATAL
                        </button>
                    </div>
                </form>
            </div>

            <div class="w-full bg-white rounded-xl border border-gray-300 shadow-[0_2px_4px_rgba(0,0,0,0.06)] overflow-hidden">
                <div class="px-3.5 py-2.5 bg-gradient-to-r from-gray-50 to-slate-50 border-b border-gray-200 flex justify-between items-center">
                    <span id="txt-table-header-title-bd" class="text-[10px] font-black text-slate-500 uppercase tracking-wider">Database Master Register [KODE]</span>
                    <span id="info-total-item-bd" class="text-xs font-mono font-black text-slate-800 bg-slate-200/60 px-2 py-0.5 rounded">
                        0 <span class="text-[9px] font-normal text-slate-500 ml-0.5">ITEM</span>
                    </span>
                </div>

                <div class="overflow-x-auto max-h-[380px]">
                    <table class="w-full text-left border-collapse">
                        <thead id="tabel-head-bank-data">
                        </thead>
                        <tbody id="tabel-body-bank-data" class="divide-y divide-gray-200 text-[12px] font-medium text-slate-700">
                            <tr>
                                <td colspan="8" class="text-center py-14 text-slate-400 font-bold">
                                    <i class="fa-solid fa-spinner fa-spin mr-1.5 text-orange-500"></i> Menghubungkan ke Live Firebase...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="w-1/3 p-3.5 space-y-4">
                <div class="w-full bg-white rounded-xl border border-gray-300 shadow-sm overflow-hidden">
                    <div class="px-4 py-2.5 bg-gray-50 border-b border-gray-200 text-xs font-bold text-slate-700 uppercase">Tambah Data Driver</div>
                    <div class="p-4 space-y-3.5">
                        <input type="text" id="tx-driver-nama" placeholder="Nama Driver" class="w-full px-3 py-2 text-xs font-bold border rounded-lg bg-gray-50/50">
                        <button onclick="simpanDataMasterBD('DRIVER')" class="w-full py-2.5 text-white font-black text-xs rounded-xl bg-orange-600">SIMPAN DRIVER</button>
                    </div>
                </div>
            </div>

            <div class="w-1/3 p-3.5 space-y-4">
                <div class="w-full bg-white rounded-xl border border-gray-300 shadow-sm overflow-hidden">
                    <div class="px-4 py-2.5 bg-gray-50 border-b border-gray-200 text-xs font-bold text-slate-700 uppercase">Tambah Data Tujuan</div>
                    <div class="p-4 space-y-3.5">
                        <input type="text" id="tx-id-tujuan" placeholder="ID Tujuan" class="w-full px-3 py-2 text-xs font-bold border rounded-lg bg-gray-50/50">
                        <button onclick="simpanDataMasterBD('TUJUAN')" class="w-full py-2.5 text-white font-black text-xs rounded-xl bg-orange-600">SIMPAN TUJUAN</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
