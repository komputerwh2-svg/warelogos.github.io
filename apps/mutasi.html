<div id="subpage-mutasi" class="fixed inset-0 bg-[#f4f4f4] z-[60] translate-x-full transition-transform duration-300 ease-in-out flex flex-col font-sans select-none overflow-hidden">
    
    <!-- Header -->
    <div class="w-full h-auto min-h-[60px] flex items-center justify-between px-3 shadow-md relative z-10" 
        style="background: linear-gradient(to bottom, #3c3c3c, #2a2a2a); border-bottom: 1px solid #1a1a1a;">
            
        <!-- Kontainer Utama Header -->
        <div class="flex flex-wrap items-center gap-4 py-2 px-3 rounded-lg">
            <!-- Bagian Kiri: Tombol Kembali & Judul -->
            <div class="flex items-center gap-4">
                <button onclick="tutupSubPageMutasi()" class="miui-btn-back flex items-center justify-center gap-1 px-3 py-1.5 rounded text-xs font-bold text-orange-400 shadow-inner">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                    <span>Kembali</span>
                </button>

                <div class="h-8 w-[1px] bg-white/10 mx-1"></div>

                <h1 class="text-white font-bold text-[14px] ml-3 tracking-wide drop-shadow-md flex items-center gap-2">
                    <i class="fa-solid fa-arrows-split-up-and-left text-orange-500"></i>
                    <span>Form Mutasi & WMS Report</span>
                    <span id="display-waktu-mutasi" class="text-orange-500 font-bold text-[14px] ml-3 tracking-wide drop-shadow-md"></span>
                </h1>
            </div>
        </div>
    </div>

    <!-- Main Content Area: 2 Kolom Layout (Tanpa Slider) -->
    <div class="flex-1 flex flex-row overflow-hidden bg-[#f4f4f4] p-4 gap-4">
        
        <!-- ================= KOLOM KIRI: FORM & TABEL MUTASI (Lebar 50%) ================= -->
        <div class="w-1/2 flex flex-col space-y-4 overflow-y-auto max-h-full pr-1">
            
            <!-- Panel Atas: Form Input Mutasi -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-orange-500 space-y-4">
                <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider mb-2">Form Input Mutasi Barang</h3>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase block mb-1">Kode Barang</label>
                        <input type="text" id="mutasi-kode" placeholder="Ketik / pilih kode..." class="w-full p-2 text-xs font-bold text-slate-800 border border-orange-300 rounded-lg bg-white uppercase">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase block mb-1">Kode Lokasi / Rak</label>
                        <input type="text" id="mutasi-lokasi" placeholder="Pilih lokasi rak..." class="w-full p-2 text-xs font-bold text-slate-800 border border-orange-300 rounded-lg bg-white uppercase">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase block mb-1">Qty Ambil</label>
                        <input type="number" id="mutasi-qty" placeholder="Jumlah..." class="w-full p-2 text-xs font-bold text-slate-800 border border-orange-300 rounded-lg bg-white">
                    </div>
                    <div class="flex items-end">
                        <button type="button" onclick="tambahItemMutasiList()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-lg font-black text-xs uppercase shadow transition">
                            <i class="fa-solid fa-plus mr-1"></i> Tambah Rak
                        </button>
                    </div>
                </div>

                <!-- Container List Mutasi Sementara -->
                <div class="mt-2">
                    <div class="text-[10px] font-black text-slate-600 uppercase mb-1">Daftar Rak Terpilih:</div>
                    <div id="container-list-mutasi" class="max-h-32 overflow-y-auto space-y-1 bg-slate-50 p-2 rounded-lg border border-orange-200 text-[11px]">
                        <div class="text-slate-400 italic text-center py-1">Belum ada rak ditambahkan</div>
                    </div>
                </div>

                <div class="flex justify-end pt-2">
                    <button onclick="simpanDataMutasi()" class="w-full bg-orange-600 hover:bg-orange-700 text-white px-5 py-2.5 rounded-xl font-black text-xs uppercase shadow transition">
                        <i class="fa-solid fa-save mr-1.5"></i> Simpan Mutasi
                    </button>
                </div>
            </div>

            <!-- Panel Bawah: Riwayat / Arsip Mutasi -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-orange-500 flex-1">
                <h3 class="text-xs font-black text-slate-700 uppercase tracking-wider mb-3">Riwayat Mutasi Gudang</h3>
                <div class="overflow-x-auto max-h-[300px]">
                    <table class="w-full text-left border-collapse text-[11px]">
                        <thead class="sticky top-0 bg-orange-100 text-slate-700 uppercase font-black z-10">
                            <tr>
                                <th class="p-2 border text-center">NO</th>
                                <th class="p-2 border">KODE</th>
                                <th class="p-2 border">LOKASI</th>
                                <th class="p-2 border text-center">QTY</th>
                                <th class="p-2 border">WAKTU</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-riwayat-mutasi-body">
                            <tr>
                                <td colspan="5" class="p-3 text-center text-slate-400 italic">Belum ada riwayat mutasi.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ================= KOLOM KANAN: WMS REPORT LIVE READER ================= -->
        <div class="w-1/2 flex flex-col space-y-4 overflow-y-auto max-h-full pl-1">
            
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-blue-500 space-y-3 flex-1 flex flex-col">
                
                <!-- Header WMS Report & 3 Filter Pencarian -->
                <div class="flex flex-col gap-2 pb-3 border-b border-slate-100">
                    <div class="flex justify-between items-center mb-3">
                        <div>
                            <h3 class="font-bold text-sm text-slate-700">WMS REPORT - 10.10.1.90</h3>
                            <span id="wms-last-update" class="text-[10px] text-slate-400">Update Data WMS Terakhir: -</span>
                        </div>
                        <button onclick="refreshWmsData()" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded shadow flex items-center gap-1 transition">
                            <svg class="w-3 h-3 animate-spin-hover" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            Update Data WMS
                        </button>
                    </div>

                    <!-- 3 Kolom Pencarian (KODE RAK, KODE BARANG, RAK NO) & Tombol Refresh -->
                    <div class="grid grid-cols-12 gap-2 items-center">
                        <!-- Kode Rak -->
                        <div class="col-span-4">
                            <label class="text-[10px] font-black text-slate-500 uppercase block mb-0.5">Kode Rak</label>
                            <input type="text" id="filter-kode-rak" oninput="filterWmsReportData()" placeholder="Ketik kode rak..." class="w-full p-1.5 text-xs font-bold border border-blue-300 rounded-lg bg-slate-50 text-slate-800 uppercase">
                        </div>
                        
                        <!-- Kode Barang -->
                        <div class="col-span-4">
                            <label class="text-[10px] font-black text-slate-500 uppercase block mb-0.5">Kode Barang</label>
                            <input type="text" id="filter-kode-barang" oninput="filterWmsReportData()" placeholder="Ketik kode barang..." class="w-full p-1.5 text-xs font-bold border border-blue-300 rounded-lg bg-slate-50 text-slate-800 uppercase">
                        </div>

                        <!-- Rak No (Dropdown 5 - 15) & Tombol Refresh -->
                        <div class="col-span-4 flex gap-1 items-end">
                            <div class="flex-1">
                                <label class="text-[10px] font-black text-slate-500 uppercase block mb-0.5">Rak No</label>
                                <select id="filter-rak-no" onchange="filterWmsReportData()" class="w-full p-1.5 text-xs font-bold border border-blue-300 rounded-lg bg-slate-50 text-slate-800 uppercase">
                                    <option value="">-- Semua --</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                    <option value="11">11</option>
                                    <option value="12">12</option>
                                    <option value="13">13</option>
                                    <option value="14">14</option>
                                    <option value="15">15</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabel WMS Report -->
                <div class="overflow-x-auto overflow-y-auto flex-1 rounded-xl border border-blue-200 max-h-[550px]">
                    <table class="w-full border-collapse text-left">
                        <thead>
                            <tr class="bg-slate-100 text-xs text-slate-600 border-b">
                                <th class="p-2 border text-center w-10">NO</th>
                                <th class="p-2 border">KODE_LOKASI</th>
                                <th class="p-2 border">KODE</th>
                                <th class="p-2 border text-center">STOK</th>
                                <th class="p-2 border text-center">EXPDATE</th>
                                <th class="p-2 border">BARCODE</th>
                                <th class="p-2 border">NAMA</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-wms-report-body">
                            <!-- Data akan dimuat di sini -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>
