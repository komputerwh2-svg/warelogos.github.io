<div id="subpage-muat-wh3" class="fixed inset-0 bg-[#f4f4f4] z-[60] translate-x-full transition-transform duration-300 ease-in-out flex flex-col font-sans select-none overflow-hidden">
    
    <!-- Header -->
    <div class="w-full h-auto min-h-[60px] flex items-center justify-between px-3 shadow-md relative z-10" 
        style="background: linear-gradient(to bottom, #3c3c3c, #2a2a2a); border-bottom: 1px solid #1a1a1a;">
            
        <!-- Kontainer Utama Header -->
        <div class="flex flex-wrap items-center gap-4 py-2 background: linear-gradient(to bottom, #3c3c3c, #2a2a2a); border-bottom: 1px solid #1a1a1a; px-3 rounded-lg">
            
            <!-- Bagian Kiri: Tombol Kembali & Judul -->
            <div class="flex items-center gap-4">
                <button onclick="tutupSubPageMuatWH3()" class="miui-btn-back flex items-center justify-center gap-1 px-3 py-1.5 rounded text-xs font-bold text-orange-400 shadow-inner">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                    <span>Kembali</span>
                </button>

                <div class="h-8 w-[1px] bg-white/10 mx-1"></div>

                <h1 class="text-white font-bold text-[14px] ml-3 tracking-wide drop-shadow-md">
                    FORM MUAT WH-3 
                    <span id="display-waktu-wh3" class="text-orange-500 font-bold text-[14px] ml-3 tracking-wide drop-shadow-md"></span>
                </h1>
            </div>
        </div>

        <div class="flex items-center background: linear-gradient(to bottom, #3c3c3c, #2a2a2a); border-bottom: 1px solid #1a1a1a; p-2 rounded-xl border border-black/10 shadow-inner gap-4">
    
            

            <!-- Garis Pemisah Tipis -->
            <div class="h-8 w-[1px] bg-white/10 mx-1"></div>

            <!-- Grup Tombol Tab: Menggunakan flex-1 agar lebih fleksibel atau tetap di kanan -->
            <div class="flex items-center gap-1 ml-auto">
                <!-- Tab 1 -->
                <label class="relative flex items-center justify-center px-4 py-2 rounded-lg text-[11px] font-black uppercase cursor-pointer transition-all">
                    <input type="radio" name="rb-muat-wh3" value="KONFIRMASI" checked onchange="gantiModulMuatWH3(this.value)" class="sr-only peer">
                    <span class="z-10 text-gray-300 peer-checked:text-white transition-colors">KONFIRMASI BOSNET</span>
                    <div class="absolute inset-0 rounded-lg shadow-md opacity-0 scale-95 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-200" style="background: linear-gradient(to bottom, #ff8b00, #f36c00);"></div>
                </label>

                <!-- Tab 2 -->
                <label class="relative flex items-center justify-center px-4 py-2 rounded-lg text-[11px] font-black uppercase cursor-pointer transition-all">
                    <input type="radio" name="rb-muat-wh3" value="RAK" onchange="gantiModulMuatWH3(this.value)" class="sr-only peer">
                    <span class="z-10 text-gray-300 peer-checked:text-white transition-colors">AMBIL RAK & BLOK</span>
                    <div class="absolute inset-0 rounded-lg shadow-md opacity-0 scale-95 peer-checked:opacity-100 peer-checked:scale-100 transition-all duration-200" style="background: linear-gradient(to bottom, #ff8b00, #f36c00);"></div>
                </label>
            </div>
        </div>
    </div>

    <!-- Slider Main Content Area -->
    <div class="flex-1 overflow-x-hidden overflow-y-auto bg-[#f4f4f4]">
        <!-- W-[200%] karena kita hanya punya 2 slide (Input & Rak) -->
        <div id="slider-content-muatwh3" class="flex flex-nowrap w-[200%] transition-transform duration-500 ease-in-out" style="transform: translateX(0%);">
            
            <!-- Slide 1: INPUT BOSNET -->
            <!-- Konten Input Bosnet (Slide 1) -->
            <div class="w-1/2 flex-shrink-0 p-4 space-y-4">
                <!-- Card Utama Input -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-orange-500">
                    <!-- Area Kontrol Input -->
                    <div class="space-y-4">
                        <!-- Header & Kontrol Utama -->
                        <div class="grid grid-cols-12 gap-4 mb-4">
                            <!-- KOLOM KIRI -->
                            <div class="col-span-12 lg:col-span-8 flex flex-col space-y-3">
                                <!-- Input Tujuan -->
                                <div class="flex gap-3">
                                    <div class="w-1/4 lg:w-1/6">
                                        <label class="text-[10px] font-black text-slate-500 uppercase ml-1 mb-1 block">Kode Tujuan:</label>
                                        <input type="text" id="input-kode-tujuan" placeholder="Cth: LPG..."
                                            class="w-full px-4 py-2 text-xs text-gray-700 font-bold border border-orange-500 rounded-xl outline-none uppercase focus:border-orange-500">
                                    </div>
                                    <div class="flex-1">
                                        <label class="text-[10px] font-black text-slate-500 uppercase ml-1 mb-1 block">Nama Lengkap Tujuan:</label>
                                        <input type="text" id="input-nama-tujuan" placeholder="Nama alamat tujuan..."
                                            class="w-full px-4 py-2 text-xs text-gray-700 font-bold border border-orange-500 rounded-xl outline-none focus:border-orange-500">
                                    </div>
                                </div>
                                
                                <!-- Textarea: Diubah dari h-32 ke flex-grow agar otomatis menyesuaikan -->
                                <div class="flex flex-col flex-grow">
                                    <label class="text-[11px] font-black text-slate-500 uppercase tracking-widest ml-1 mb-1 block">Pastekan data bosnet kesini:</label>
                                    <textarea id="ta-bosnet-input" 
                                        class="w-full flex-grow p-4 bg-slate-50 border border-orange-500 rounded-xl text-xs font-medium text-slate-700 focus:border-orange-500 transition-all resize-none shadow-inner"
                                        placeholder="Paste data dari Bosnet di sini..."></textarea>
                                </div>
                            </div>

                            <!-- KOLOM KANAN -->
                            <div class="col-span-12 lg:col-span-4 flex flex-col gap-3">
                                <!-- Dropdown -->
                                <div class="grid grid-cols-2 gap-2 bg-orange-50 p-3 rounded-xl border border-orange-500">
                                    <div>
                                        <label class="text-[10px] font-black text-slate-500 uppercase ml-1 mb-1 block">Periode Bulan</label>
                                        <select id="select-periode-muat" onchange="updateTanggalDropdownMuatWH3()" class="w-full px-2 py-1 text-[10px] text-slate-700 font-bold border border-orange-500 rounded-md"></select>
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-black text-slate-500 uppercase ml-1 mb-1 block">Tanggal Muat</label>
                                        <select id="select-tanggal-muat" onchange="renderTabelGabungan()" class="w-full px-2 py-1 text-[10px] text-slate-700 font-bold border border-orange-500 rounded-md">
                                            <option value="">Pilih Tgl</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <!-- Statistik -->
                                <div class="grid grid-cols-2 gap-2">
                                    <div class="bg-white p-2 rounded-xl border border-orange-500 text-center">
                                        <span class="text-[10px] font-black text-slate-400 uppercase">Total Tujuan:</span>
                                        <div id="txt-total-tujuan" class="text-lg font-black text-slate-800">0</div>
                                    </div>
                                    <div class="bg-white p-2 rounded-xl border border-orange-500 text-center">
                                        <span class="text-[10px] font-black text-slate-400 uppercase">Total Nomor DO:</span>
                                        <div id="txt-total-nodo" class="text-lg font-black text-orange-600">0</div>
                                    </div>
                                </div>

                                <!-- Tombol -->
                                <div class="flex gap-2 w-full">
                                    <button onclick="prosesDataBosnet()" class="flex-[3] py-3 bg-orange-500 text-white font-black text-[10px] rounded-lg hover:bg-orange-600 uppercase transition-all">CONVERT DATA</button>
                                    <button onclick="bukaFileMutasi()" class="flex-[2] py-3 bg-emerald-600 text-white font-black text-[10px] rounded-lg hover:bg-emerald-700 uppercase transition-all">MUTASI DEPO/SP</button>
                                        <!-- Hidden Input (Wajib ada dengan ID yang tepat untuk dipanggil oleh bukaFileMutasi) -->
                                        <input type="file" id="input-file-mutasi" accept=".xls,.xlsx" class="hidden" onchange="prosesFileMutasi(event)">
                                    <button onclick="resetFormulir()" class="flex-[1] py-3 bg-rose-500 text-white font-black text-[10px] rounded-lg hover:bg-rose-600 uppercase transition-all">BATAL</button>
                                </div>
                            </div>
                        </div>
                    </div>   
                </div>

                <!-- Tabel Data Tersimpan -->
                <div class="overflow-x-auto bg-white rounded-2xl shadow-sm border border-orange-500 p-4">
                    <table class="w-full text-left border-collapse">
                        <!-- Header 2 Baris -->
                        <thead id="tabel-matriks-head" class="text-[11px] uppercase font-black text-slate-800 border-b-2 border-blue-200 bg-orange-100">
                            <!-- Akan diisi otomatis oleh JS dengan 2 baris <tr> -->
                        </thead>
                        
                        <!-- Body Data -->
                        <tbody id="tabel-matriks-body" class="text-[11px] font-bold text-slate-800">
                            <!-- Data akan diisi oleh JavaScript -->
                        </tbody>
                        
                        <!-- Opsional: Footer untuk Total per Kolom -->
                        <tfoot id="tabel-matriks-foot" class="border-t-2 border-slate-200 text-[11px] font-black text-slate-800 bg-slate-50">
                            <!-- Total per NO DO bisa diisi di sini -->
                        </tfoot>
                    </table>
                </div>
            </div>

            <!-- Slide 2: RAK & PENGAMBILAN BLOK (Sangat Simpel) -->
            <div class="w-1/2 flex-shrink-0 p-3.5 space-y-4" id="slide-rak-blok">
                
                <!-- Header & Filter (Label di atas Dropdown) -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-orange-200 flex items-end justify-between gap-4">
                    
                    <!-- Judul di kiri -->
                    <h2 class="text-[20px] font-black text-slate-500 uppercase tracking-widest ml-1 mb-1.5 block">
                        Manajemen Rak & Blok
                    </h2>
                    
                    <!-- Kontrol Terpadu -->
                    <div class="grid grid-cols-[1fr,auto] items-end gap-3 bg-orange-50 p-3 rounded-xl border border-orange-500 w-full">
                        
                        <!-- Dropdown -->
                        <div>
                            <label for="select-tanggal-stok-wh3" class="text-[10px] font-black text-slate-500 uppercase ml-1 mb-1 block">
                                Pilih Tanggal Stok
                            </label>
                            <select id="select-tanggal-stok-wh3" class="w-full px-2 py-2 text-[11px] text-slate-700 font-bold border border-orange-500 rounded-md">
                                <option value="">-- Pilih Tanggal --</option>
                            </select>
                        </div>

                        <!-- Tombol-tombol -->
                        <div class="flex items-center gap-4">
                            <button id="btn-proses-otomatis" onclick="window.prosesOtomatisStok()" 
                                class="bg-orange-600 text-white font-black py-3 px-6 rounded-md text-[10px] uppercase transition-all whitespace-nowrap">
                                Proses Rak & Blok
                            </button>
                            
                            <button id="btn-simpan-rak-blok" onclick="simpanDataRakBlok()" 
                                class="bg-orange-600 text-white font-black py-3 px-6 rounded-md text-[10px] uppercase transition-all whitespace-nowrap">
                                Simpan Rak & Blok
                            </button>

                            <button id="btn-cetak-rak-blok" onclick="cetakSemuaVersi()" 
                                class="bg-orange-600 text-white font-black py-3 px-6 rounded-md text-[10px] uppercase transition-all whitespace-nowrap">
                                Cetak Muat WH-3
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Area Hasil (Bersih & Langsung ke Inti) -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-orange-200 min-h-[400px]">
                    <table class="w-full text-xs border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 uppercase">
                                <th class="p-3 border">KODE</th>
                                <th class="p-3 border">TOTAL</th>
                                <th class="p-3 border">PLT | KRT</th>
                                <th class="p-3 border">RAK AMBIL</th>
                                <th class="p-3 border">TOTAL STOK</th>
                                <th class="p-3 border">SISA STOK</th>
                                <th class="p-3 border">PLT | KRT</th>
                                <th class="p-3 border">AMBIL BLOK</th>
                                <th class="p-3 border">EXP BLOK</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-rak-body">
                            <!-- Data akan di-render di sini -->
                        </tbody>
                    </table>
                </div>

            </div>

        </div>
    </div>
</div>
